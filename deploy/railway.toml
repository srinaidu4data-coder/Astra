# Railway: deploy API from repo root
# https://railway.app → New Project → Deploy from GitHub

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
startCommand = "sh -c \"export COPILOT_API_HOST=0.0.0.0; export COPILOT_API_PORT=${PORT:-8787}; export JOBSEARCH_AI_ENABLED=0; python copilot_api.py\""
